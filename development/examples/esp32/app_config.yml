# ESP32 BNO08x Driver - Apps Configuration
# This file centralizes all app definitions, their source files, and metadata
# Used by build scripts, flash scripts, CI workflows, and CMake
#
# HIERARCHICAL CONFIGURATION:
# - Global settings in 'metadata' section apply to all apps by default
# - Individual apps can override 'idf_versions' and 'build_types' if needed
# - Apps without overrides use global settings automatically

version: "1.0"

metadata:
  project: "ESP32 BNO08x Driver Examples"
  default_app: "driver_integration_test"
  target: "esp32c6"
  idf_versions: ["release/v5.5", "release/v5.4"]
  build_types: [["Debug", "Release"], ["Debug"]]

apps:
  # --------------------------------------------------------------------------
  # Driver Integration Test Suite
  # --------------------------------------------------------------------------
  driver_integration_test:
    description: "Comprehensive driver integration test suite (no hardware required)"
    source_file: "DriverIntegrationTest.cpp"
    category: "test"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true
    documentation: "docs/README_DRIVER_INTEGRATION_TEST.md"
    test_sections:
      - "INITIALIZATION_TESTS"
      - "SENSOR_ENABLE_TESTS"
      - "POLLING_MODE_TESTS"
      - "CALLBACK_MODE_TESTS"
      - "SENSOR_DATA_TESTS"
      - "RVC_MODE_TESTS"
      - "ERROR_HANDLING_TESTS"
    features:
      - "Complete driver API validation (30+ tests)"
      - "Multiple test sections covering all functionality"
      - "Initialization, sensor enable/disable, data reading"
      - "Polling and callback modes"
      - "RVC mode testing"
      - "Error condition validation"
      - "FreeRTOS task-based test execution"
      - "GPIO14 progress indicator"
      - "Automatic pass/fail tracking"
      - "No actual hardware required (driver test only)"

  # --------------------------------------------------------------------------
  # Basic Polling Example
  # --------------------------------------------------------------------------
  basic_polling:
    description: "Basic polling mode example with orientation and linear acceleration"
    source_file: "BasicPollingExample.cpp"
    category: "example"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: true
    hardware_required: true
    features:
      - "Simple polling loop"
      - "Rotation vector and linear acceleration sensors"
      - "Euler angle calculation"
      - "Real hardware testing"

  # --------------------------------------------------------------------------
  # Event-Driven Callback Example
  # --------------------------------------------------------------------------
  event_driven_callback:
    description: "Event-driven callback example with step counter and tap detector"
    source_file: "EventDrivenCallbackExample.cpp"
    category: "example"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: true
    hardware_required: true
    features:
      - "Callback-based event handling"
      - "Step counter and tap detector"
      - "Gesture detection"
      - "Real hardware testing"

  # --------------------------------------------------------------------------
  # Full Features Example
  # --------------------------------------------------------------------------
  full_features:
    description: "Comprehensive example demonstrating all BNO08x features"
    source_file: "FullFeaturesExample.cpp"
    category: "example"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: true
    hardware_required: true
    features:
      - "Multiple sensor types enabled"
      - "Both callback and polling methods"
      - "Orientation, acceleration, gyroscope, gravity"
      - "Step counter, tap detector, gesture events"
      - "Real hardware testing"

  # --------------------------------------------------------------------------
  # RVC Mode Example
  # --------------------------------------------------------------------------
  rvc_mode:
    description: "RVC (Reduced Vector Computation) mode example"
    source_file: "RvcModeExample.cpp"
    category: "example"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: false
    featured: true
    hardware_required: true
    features:
      - "RVC mode initialization"
      - "Frame callback handling"
      - "Yaw, pitch, roll reading"
      - "Real hardware testing"

# ============================================================================
# BUILD CONFIGURATION (ESP-IDF Standard Build Types)
# ============================================================================

build_config:
  # Standard ESP-IDF/CMake build types
  # These match CMAKE_BUILD_TYPE values in ESP-IDF
  build_types:
    Debug:
      description: "Debug build with symbols, verbose logging, assertions"
      cmake_build_type: "Debug"
      optimization: "-O0"
      debug_level: "-g3"
      defines: ["DEBUG", "BNO08X_DEBUG"]

    Release:
      description: "Release build optimized for performance"
      cmake_build_type: "Release"
      optimization: "-O2"
      debug_level: "-g0"
      defines: ["NDEBUG", "BNO08X_RELEASE"]

  build_directory_pattern: "build-app-{app_type}-type-{build_type}-target-{target}-idf-{idf_version}"
  project_name_pattern: "esp32_bno08x_{app_type}_app"

ci_config:
  # CI build timeout
  timeout_minutes: 30
  # Fail fast on first error
  fail_fast: false
  # Apps to exclude from specific build types (if needed)
  exclude_combinations: []
  # Apps that require special handling
  special_apps: []

