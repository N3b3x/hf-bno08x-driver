<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" role="img" aria-labelledby="t-bno d-bno">
  <title id="t-bno">BNO08x SH-2 sensor stack and host integration</title>
  <desc id="d-bno">Inside the BNO08x package: 3-axis accelerometer, gyroscope, magnetometer feed an internal MCU running the SH-2 sensor-hub firmware which performs fusion and exposes calibrated reports over I2C, SPI or UART to the host driver. PSn boot pins select the host transport.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .panel    { fill: #ffffff; }
      .pkg      { fill: #fef5e7; stroke: #c05621; stroke-width: 2; }
      .sensor   { fill: #ffffff; stroke: #1a365d; stroke-width: 1.6; }
      .fusion   { fill: #ebf4ff; stroke: #2c5282; stroke-width: 2; }
      .iface    { fill: #f4f6f8; stroke: #1a365d; stroke-width: 2; }
      .host     { fill: #f0fff4; stroke: #276749; stroke-width: 2; }
      .axisFrame{ fill: #ffffff; stroke: #1a365d; stroke-width: 1.5; }
      .wire     { stroke: #2b6cb0; stroke-width: 2.2; fill: none; stroke-linecap: round; }
      .wire-bus { stroke: #2c5282; stroke-width: 3;   fill: none; stroke-linecap: round; }
      .head     { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .title    { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .titleL   { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #1a365d; text-anchor: start; }
      .small    { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: middle; }
      .smallL   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: start; }
      .pin      { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 11px; fill: #1a202c; text-anchor: middle; }
      .pinL     { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 11px; fill: #1a202c; text-anchor: start; }
      .legend   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; }
      .axisX    { stroke: #c53030; stroke-width: 2.5; fill: none; }
      .axisY    { stroke: #276749; stroke-width: 2.5; fill: none; }
      .axisZ    { stroke: #2b6cb0; stroke-width: 2.5; fill: none; }
    ]]></style>
    <marker id="ar-bno" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#2b6cb0"/>
    </marker>
    <marker id="ar-x" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#c53030"/>
    </marker>
    <marker id="ar-y" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#276749"/>
    </marker>
    <marker id="ar-z" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#2b6cb0"/>
    </marker>
  </defs>
  <rect class="panel" width="880" height="540"/>

  <text class="head" x="440" y="26">BNO080 / 085 / 086 - SH-2 sensor stack and host integration</text>
  <text class="small" x="440" y="44">All three parts share the SH-2 firmware interface. The host transport (I2C / SPI / UART) is selected by the PS1 / PS0 boot pins.</text>

  <!--
    Layout:
      column A (40..220)  : 3 sensor boxes stacked
      column B (260..480) : SH-2 fusion firmware box
      column C (520..760) : 3 host-transport boxes stacked + driver block below
  -->

  <!-- BNO08x package outline (encloses sensors + fusion) -->
  <rect class="pkg" x="20" y="74" width="500" height="280" rx="12"/>
  <text class="head" x="270" y="98">BNO08x package</text>

  <!-- 3 sensor boxes (column A) -->
  <g>
    <rect class="sensor" x="40" y="120" width="160" height="56" rx="6"/>
    <text class="title" x="120" y="142">3-axis accelerometer</text>
    <text class="small" x="120" y="162">+/- 2..16 g, raw + calibrated</text>

    <rect class="sensor" x="40" y="190" width="160" height="56" rx="6"/>
    <text class="title" x="120" y="212">3-axis gyroscope</text>
    <text class="small" x="120" y="232">+/- 125..2000 deg/s</text>

    <rect class="sensor" x="40" y="260" width="160" height="56" rx="6"/>
    <text class="title" x="120" y="282">3-axis magnetometer</text>
    <text class="small" x="120" y="302">soft / hard-iron calibrated</text>
  </g>

  <!-- SH-2 fusion firmware box (column B) -->
  <rect class="fusion" x="240" y="160" width="260" height="156" rx="8"/>
  <text class="title" x="370" y="184">SH-2 sensor-hub firmware</text>
  <text class="small" x="370" y="204">fusion + activity classifier</text>
  <text class="small" x="370" y="222">rotation vector &#183; gravity</text>
  <text class="small" x="370" y="238">linear accel &#183; step counter</text>
  <text class="small" x="370" y="254">tap detector &#183; stability</text>
  <text class="small" x="370" y="272">ARVR-stabilized RV (BNO085/086)</text>
  <text class="small" x="370" y="290">DCD calibration storage</text>
  <text class="small" x="370" y="306">runs on the chip's internal MCU</text>

  <!-- Sensor -> fusion arrows (clean horizontal arrows from sensor right to fusion left) -->
  <line class="wire" x1="200" y1="148" x2="240" y2="190" marker-end="url(#ar-bno)"/>
  <line class="wire" x1="200" y1="218" x2="240" y2="238" marker-end="url(#ar-bno)"/>
  <line class="wire" x1="200" y1="288" x2="240" y2="286" marker-end="url(#ar-bno)"/>

  <!-- Host transports column C -->
  <g>
    <rect class="iface" x="560" y="100" width="240" height="50" rx="6"/>
    <text class="title" x="680" y="120">I2C  (PS1=0, PS0=0)</text>
    <text class="small" x="680" y="138">SCL/SDA &#183; INT/RST</text>

    <rect class="iface" x="560" y="160" width="240" height="50" rx="6"/>
    <text class="title" x="680" y="180">SPI  (PS1=1, PS0=1)</text>
    <text class="small" x="680" y="198">SCK/MOSI/MISO/CS &#183; INT/RST</text>

    <rect class="iface" x="560" y="220" width="240" height="50" rx="6"/>
    <text class="title" x="680" y="240">UART  (PS1=0, PS0=1) / RVC</text>
    <text class="small" x="680" y="258">SHTP framing or simplified RVC streaming</text>

    <!-- Driver block (below transports) -->
    <rect class="host" x="560" y="290" width="240" height="50" rx="6"/>
    <text class="title" x="680" y="310">HF-BNO08x driver (your code)</text>
    <text class="small" x="680" y="328">CommInterface&lt;&gt; &#183; Update() &#183; EnableSensor()</text>
  </g>

  <!-- Fusion -> transports trunk routing -->
  <line class="wire-bus" x1="500" y1="238" x2="540" y2="238"/>
  <line class="wire-bus" x1="540" y1="125" x2="540" y2="320"/>
  <line class="wire-bus" x1="540" y1="125" x2="560" y2="125" marker-end="url(#ar-bno)"/>
  <line class="wire-bus" x1="540" y1="185" x2="560" y2="185" marker-end="url(#ar-bno)"/>
  <line class="wire-bus" x1="540" y1="245" x2="560" y2="245" marker-end="url(#ar-bno)"/>
  <line class="wire-bus" x1="540" y1="320" x2="560" y2="320" marker-end="url(#ar-bno)"/>

  <!-- Body-axes diagram (own panel, bottom-left) -->
  <rect class="axisFrame" x="40" y="374" width="240" height="140" rx="6"/>
  <text class="title" x="160" y="394">SH-2 body axes (right-handed)</text>
  <g transform="translate(120, 454)">
    <line class="axisX" x1="0" y1="0" x2="60" y2="0"   marker-end="url(#ar-x)"/>
    <line class="axisY" x1="0" y1="0" x2="0"  y2="-40" marker-end="url(#ar-y)"/>
    <line class="axisZ" x1="0" y1="0" x2="-30" y2="30"  marker-end="url(#ar-z)"/>
    <text class="pinL" fill="#c53030" x="64" y="4">+X</text>
    <text class="pinL" fill="#276749" x="6" y="-44">+Y</text>
    <text class="pinL" fill="#2b6cb0" x="-54" y="38">+Z</text>
  </g>
  <text class="smallL" x="56" y="500">RotationVector returns</text>
  <text class="smallL" x="56" y="512">quaternion (w, x, y, z)</text>

  <!-- Bottom legend in its own row (y=494..510) -->
  <g transform="translate(300, 396)">
    <text class="titleL" x="0" y="0" fill="#1a365d">Legend</text>

    <rect class="sensor" x="0" y="14" width="14" height="14"/>
    <text class="legend" x="22" y="25">Physical MEMS sensor (inside BNO08x)</text>

    <rect class="fusion" x="0" y="34" width="14" height="14"/>
    <text class="legend" x="22" y="45">SH-2 firmware (on-chip MCU)</text>

    <rect class="iface" x="0" y="54" width="14" height="14"/>
    <text class="legend" x="22" y="65">Host transport (PSn-selected)</text>

    <rect class="host" x="0" y="74" width="14" height="14"/>
    <text class="legend" x="22" y="85">Driver layer (your code)</text>

    <line class="wire-bus" x1="0" y1="98" x2="24" y2="98" marker-end="url(#ar-bno)"/>
    <text class="legend" x="32" y="101">Sensor reports</text>
  </g>
</svg>
