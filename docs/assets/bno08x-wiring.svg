<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="t-bno d-bno">
  <title id="t-bno">BNO08x I2C wiring with boot-pin strapping</title>
  <desc id="d-bno">Wiring diagram for the BNO08x 9-axis IMU in I2C mode showing MCU connections, 4.7k ohm pull-up resistors on SCL and SDA, interrupt and reset control lines, and PS0/PS1/ADR boot-pin strapping tied to GND for I2C address selection.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .panel    { fill: #ffffff; }
      .box      { fill: #f4f6f8; stroke: #1a365d; stroke-width: 2; }
      .chip     { fill: #fef5e7; stroke: #c05621; stroke-width: 2; }
      .wire-pwr { stroke: #c53030; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-gnd { stroke: #4a5568; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-i2c { stroke: #2b6cb0; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-ctrl{ stroke: #276749; stroke-width: 2; fill: none; stroke-linecap: round; stroke-dasharray: 5 3; }
      .wire-strap{stroke: #d69e2e; stroke-width: 2; fill: none; stroke-linecap: round; stroke-dasharray: 4 2; }
      .pullup   { fill: #ebf4ff; stroke: #2c5282; stroke-width: 1.5; }
      .head     { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .title    { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .titleL   { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #1a365d; text-anchor: start; }
      .small    { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: middle; }
      .smallL   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: start; }
      .pinL     { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 12px; fill: #1a202c; text-anchor: start; }
      .pinR     { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 12px; fill: #1a202c; text-anchor: end; }
      .legend   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; }
    ]]></style>
  </defs>

  <rect class="panel" width="880" height="420"/>

  <!-- Title -->
  <text class="head" x="440" y="28">BNO08x &#8212; I2C wiring with boot-pin strapping</text>
  <text class="small" x="440" y="46">PS0=GND, PS1=GND &#8594; I2C mode &#8212; ADR=GND &#8594; address 0x4A</text>

  <!-- ===== MCU box (left) ===== -->
  <rect class="box" x="60" y="70" width="160" height="220" rx="8"/>
  <text class="title" x="140" y="92">MCU</text>
  <text class="pinL" x="76" y="120">3.3V</text>
  <text class="pinL" x="76" y="148">GND</text>
  <text class="pinL" x="76" y="176">SCL</text>
  <text class="pinL" x="76" y="204">SDA</text>
  <text class="pinL" x="76" y="232">INT</text>
  <text class="smallL" x="112" y="244">(input)</text>
  <text class="pinL" x="76" y="268">NRST</text>
  <text class="smallL" x="122" y="280">(output)</text>

  <!-- ===== BNO08x chip (right) ===== -->
  <rect class="chip" x="580" y="70" width="200" height="280" rx="10"/>
  <text class="title" x="680" y="92">BNO08x</text>
  <text class="smallL" x="600" y="108">9-axis IMU (SH-2)</text>
  <text class="pinR" x="764" y="140">VIN</text>
  <text class="pinR" x="764" y="168">GND</text>
  <text class="pinR" x="764" y="196">SCL</text>
  <text class="pinR" x="764" y="224">SDA</text>
  <text class="pinR" x="764" y="252">INT</text>
  <text class="pinR" x="764" y="280">NRST</text>
  <text class="pinR" x="764" y="308">PS0</text>
  <text class="pinR" x="764" y="322">PS1</text>
  <text class="pinR" x="764" y="336">ADR</text>

  <!-- ===== 3.3V rail (red horizontal line at top) ===== -->
  <line class="wire-pwr" x1="340" y1="66" x2="560" y2="66"/>
  <text class="smallL" x="420" y="60">3.3V rail</text>

  <!-- ===== Power wires ===== -->
  <!-- MCU 3.3V to rail -->
  <polyline class="wire-pwr" points="220,116 280,116 280,66"/>
  <!-- Rail to BNO08x VIN -->
  <polyline class="wire-pwr" points="560,66 560,136 580,136"/>

  <!-- ===== GND wires ===== -->
  <!-- MCU GND to BNO08x GND -->
  <polyline class="wire-gnd" points="220,144 300,144 300,164 580,164"/>

  <!-- ===== I2C wires with pull-ups ===== -->

  <!-- SCL wire: MCU -> junction -> BNO08x -->
  <polyline class="wire-i2c" points="220,172 380,172 380,192 580,192"/>
  <!-- SCL pull-up: junction up to 3.3V rail -->
  <line class="wire-i2c" x1="380" y1="172" x2="380" y2="108"/>
  <line class="wire-pwr" x1="380" y1="86" x2="380" y2="66"/>
  <!-- SCL pull-up resistor box -->
  <rect class="pullup" x="366" y="86" width="28" height="22" rx="3"/>
  <text class="small" x="380" y="101">4.7k&#937;</text>

  <!-- SDA wire: MCU -> junction -> BNO08x -->
  <polyline class="wire-i2c" points="220,200 460,200 460,220 580,220"/>
  <!-- SDA pull-up: junction up to 3.3V rail -->
  <line class="wire-i2c" x1="460" y1="200" x2="460" y2="108"/>
  <line class="wire-pwr" x1="460" y1="86" x2="460" y2="66"/>
  <!-- SDA pull-up resistor box -->
  <rect class="pullup" x="446" y="86" width="28" height="22" rx="3"/>
  <text class="small" x="460" y="101">4.7k&#937;</text>

  <!-- ===== Control wires (dashed green) ===== -->
  <!-- INT: MCU <- BNO08x -->
  <polyline class="wire-ctrl" points="220,228 520,228 520,248 580,248"/>
  <!-- NRST: MCU -> BNO08x -->
  <polyline class="wire-ctrl" points="220,264 540,264 540,276 580,276"/>

  <!-- ===== Boot-pin strapping (dashed yellow to GND) ===== -->
  <!-- GND bus bar at bottom -->
  <line class="wire-gnd" x1="580" y1="370" x2="810" y2="370"/>
  <text class="smallL" x="812" y="374">GND</text>

  <!-- PS0 to GND -->
  <polyline class="wire-strap" points="580,304 540,304 540,370"/>
  <!-- PS1 to GND -->
  <polyline class="wire-strap" points="580,318 520,318 520,370"/>
  <!-- ADR to GND -->
  <polyline class="wire-strap" points="580,332 500,332 500,370"/>

  <!-- PS0/PS1 annotation -->
  <text class="smallL" x="500" y="392">PS0=0, PS1=0 &#8594; I2C mode</text>
  <text class="smallL" x="500" y="406">ADR=0 &#8594; I2C addr 0x4A</text>

  <!-- ===== Legend ===== -->
  <g transform="translate(40, 390)">
    <text class="titleL" x="0" y="0">Legend</text>
    <line class="wire-pwr" x1="60" y1="-4" x2="84" y2="-4"/>
    <text class="legend" x="90" y="0">3.3V power</text>
    <line class="wire-gnd" x1="160" y1="-4" x2="184" y2="-4"/>
    <text class="legend" x="190" y="0">GND</text>
    <line class="wire-i2c" x1="220" y1="-4" x2="244" y2="-4"/>
    <text class="legend" x="250" y="0">I2C (SCL/SDA)</text>
    <line class="wire-ctrl" x1="340" y1="-4" x2="364" y2="-4"/>
    <text class="legend" x="370" y="0">Control (INT/NRST)</text>
  </g>

  <g transform="translate(40, 410)">
    <line class="wire-strap" x1="60" y1="-4" x2="84" y2="-4"/>
    <text class="legend" x="90" y="0">Boot strapping (to GND)</text>
    <rect class="pullup" x="260" y="-12" width="14" height="14" rx="2"/>
    <text class="legend" x="280" y="0">Pull-up resistor</text>
  </g>
</svg>
